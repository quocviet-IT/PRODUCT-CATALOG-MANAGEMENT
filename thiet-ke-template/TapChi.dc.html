<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;family=EB+Garamond:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: "EB Garamond", Georgia, serif; }
    a { color: #C4165F; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: {{p.nen}}; color: {{p.than}}; display: flex; flex-direction: column; overflow: hidden; font-family: 'EB Garamond', Georgia, serif">

  <div style="padding: 30px 22px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; letter-spacing: 0.14em; color: {{p.nhan}}">HUNG PHAT</div>
      <div style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: {{p.mo}}">Chị Lan · 6 mẫu</div>
    </div>
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 40px; line-height: 1.05; color: {{p.muc}}">Nhẫn cưới<br>18K</div>
  </div>

  <!-- Moi mau: anh tran mot mep, chu o mep con lai. Le doi ben so le/chan. -->
  <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 30px">
    <sc-for list="{{muc}}" as="m" hint-placeholder-count="2">
      <div style="display: flex; align-items: stretch; gap: 16px; flex-direction: {{m.chieu}}">

        <div style="width: 232px; flex-shrink: 0; height: 232px; background: {{p.deAnh}}; display: flex; align-items: center; justify-content: center; overflow: hidden">
          <sc-if value="{{m.hot}}" hint-placeholder-val="{{ true }}">
            <svg viewBox="0 0 200 150" width="215" height="161" aria-hidden="true">
              <defs>
                <linearGradient id="tcA" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#EFD9A6"></stop>
                  <stop offset="0.45" stop-color="#C9A465"></stop>
                  <stop offset="1" stop-color="#8C7137"></stop>
                </linearGradient>
              </defs>
              <ellipse cx="100" cy="140" rx="40" ry="4.5" fill="#2A2725" opacity="0.08"></ellipse>
              <ellipse cx="100" cy="84" rx="45" ry="51" fill="none" stroke="url(#tcA)" stroke-width="9"></ellipse>
              <g fill="#FFFFFF" stroke="#CFD7E0" stroke-width="0.7">
                <circle cx="100" cy="33" r="4.3"></circle>
                <circle cx="128" cy="44" r="4"></circle>
                <circle cx="143" cy="71" r="4"></circle>
                <circle cx="142" cy="102" r="4"></circle>
                <circle cx="124" cy="124" r="4"></circle>
                <circle cx="76" cy="124" r="4"></circle>
                <circle cx="58" cy="102" r="4"></circle>
                <circle cx="57" cy="71" r="4"></circle>
                <circle cx="72" cy="44" r="4"></circle>
              </g>
            </svg>
          </sc-if>
          <sc-if value="{{m.tron}}" hint-placeholder-val="{{ true }}">
            <svg viewBox="0 0 200 150" width="215" height="161" aria-hidden="true">
              <defs>
                <linearGradient id="tcB" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#EFD9A6"></stop>
                  <stop offset="0.45" stop-color="#C9A465"></stop>
                  <stop offset="1" stop-color="#8C7137"></stop>
                </linearGradient>
              </defs>
              <ellipse cx="100" cy="140" rx="40" ry="4.5" fill="#2A2725" opacity="0.08"></ellipse>
              <ellipse cx="100" cy="84" rx="45" ry="51" fill="none" stroke="url(#tcB)" stroke-width="13"></ellipse>
              <ellipse cx="100" cy="84" rx="45" ry="51" fill="none" stroke="#FFF6E0" stroke-width="1.4" opacity="0.5"></ellipse>
            </svg>
          </sc-if>
        </div>

        <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 20px">
          <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; line-height: 1; color: {{p.nhan}}">{{m.so}}</div>
          <div style="width: 26px; height: 1px; background: {{p.ke}}"></div>
          <div style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: {{p.mo}}">{{m.ma}}</div>
          <div style="display: flex; flex-direction: column; gap: 3px">
            <sc-for list="{{m.ts}}" as="x" hint-placeholder-count="4">
              <div style="font-size: 13px; line-height: 1.45; color: {{p.than}}">{{x}}</div>
            </sc-for>
          </div>
        </div>

      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "nen": {"editor": "enum", "options": ["kem", "ngà", "than", "rêu"], "default": "than", "section": "Màu"},
  "nhan": {"editor": "color", "options": ["#D4436F", "#A96A00", "#00806B", "#A0439B"], "default": "#00806B", "section": "Màu"},
  "$preview": {"width": 390, "height": 844}
}'>
const NEN = {
  "kem":  { nen: "#F7F1EB", muc: "#2A2725", than: "#4A4540", mo: "#6E6760", ke: "#D4CFC4", deAnh: "#FCFAF7" },
  "ngà":  { nen: "#FBF9F5", muc: "#1B1A19", than: "#3C3A38", mo: "#6B6864", ke: "#E4E1DC", deAnh: "#FFFFFF" },
  "than": { nen: "#17150F", muc: "#F2EBDF", than: "#D8D0C2", mo: "#9A9184", ke: "#33302A", deAnh: "#FCFAF7" },
  "rêu":  { nen: "#1B231D", muc: "#EDF0E9", than: "#CDD4C8", mo: "#8D978A", ke: "#303A32", deAnh: "#FCFAF7" }
};

class Component extends DCLogic {
  renderVals() {
    const p = Object.assign({}, NEN[this.props.nen] || NEN["than"]);
    p.nhan = this.props.nhan || "#00806B";
    return {
      p: p,
      muc: [
        {
          so: "01", ma: "D12741", hot: true, tron: false, chieu: "row",
          ts: ["Nhẫn · 14K", "Yellow · Size 10", "TL vàng 2,78 g"]
        },
        {
          so: "02", ma: "D11030", hot: false, tron: true, chieu: "row-reverse",
          ts: ["Nhẫn · 18K", "Yellow · Size 6.75", "TL vàng 2,12 g"]
        }
      ]
    };
  }
}
</script>
</body>
</html>
